<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Estudio de la Pisada">
  <title>Estudio de la Pisada · isotipo</title>
  <!-- El mapa de presión del podógrafo, reducido a sus isobaras.
       Antepié arriba y talón abajo, desplazados sobre el eje real de la huella.
       Afuera la presión baja (azul), en el medio el arco (verde), adentro la carga (rojo). -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- antepié · isobara externa, más ancha que alta y con la inclinación de la huella -->
    <ellipse cx="34" cy="20" rx="17" ry="12.5" transform="rotate(-9 34 20)"
             stroke="#1D6A8C" stroke-width="5.5"/>
    <!-- antepié · núcleo de carga -->
    <ellipse cx="34" cy="20" rx="7.5" ry="4.6" transform="rotate(-9 34 20)" fill="#D9452E"/>
    <!-- arco · banda de transición por el borde interno -->
    <path d="M20.5 30.5c4.6 4.2 6.4 9 5.4 14.4" stroke="#3FA36B" stroke-width="5.5"/>
    <!-- talón · isobara externa, más chica y corrida hacia el eje -->
    <ellipse cx="25" cy="51" rx="10.5" ry="9" stroke="#F0A93B" stroke-width="5.5"/>
    <!-- talón · núcleo de carga -->
    <circle cx="25" cy="51" r="3.8" fill="#D9452E"/>
  </g>
</svg>
